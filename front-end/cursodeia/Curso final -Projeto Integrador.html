<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inteligência Artificial na Prática</title>
<style>
:root{--bg:#0a1f5c;--fg:#f4f8ff;--mut:#c5d3f2;--a:#7dd3fc;--y:#fde047;--r:#fb7185;--card:#ffffff14;--bd:#ffffff40;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",Inter,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(60vmin 60vmin at 100% 0,#ffffff1f,transparent),radial-gradient(60vmin 60vmin at 0 100%,#00000040,transparent),var(--bg)}
.steps{display:flex;gap:1.5vmin;padding:2vmin 5vw;font-size:max(1.9vmin,12px);font-weight:700;overflow:hidden}
.st{flex:1;padding-top:1vmin;border-top:.6vmin solid var(--bd);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done{border-color:var(--a);color:var(--fg)}
.st.on{border-color:var(--y);color:var(--y)}
.sl{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center;align-items:center;text-align:center;gap:2.2vmin;padding:1vmin 6vw;overflow-y:auto;overflow-x:hidden;animation:in .4s}
.sl>*{flex-shrink:0;max-width:100%;overflow-wrap:anywhere}
@keyframes in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.sl{animation:none}}
h1{font-weight:800;font-size:clamp(32px,8.2vmin,120px);line-height:1.12;letter-spacing:-.02em}
h2{font-size:clamp(24px,4.9vmin,68px);line-height:1.25;font-weight:700}
p,.sub{font-size:clamp(18px,3.7vmin,48px);color:var(--mut)}
.g{color:var(--y);font-weight:800}
.q{font-weight:700;color:#fff;background:#ffffff1a;border-radius:1.5vmin;border-top:.7vmin solid var(--r);padding:2.2vmin 3vmin;font-size:clamp(24px,5.4vmin,74px);line-height:1.35}
.row{display:flex;gap:2vmin;flex-wrap:wrap;align-items:stretch;justify-content:center;width:100%}
.c{text-align:center;flex:1 1 18vmin;min-width:0;background:var(--card);border:.4vmin solid var(--bd);border-radius:2vmin;padding:2vmin 2.4vmin;font-size:clamp(18px,3.6vmin,48px);font-weight:700;line-height:1.25}
.c small{display:block;margin-top:.8vmin;font-size:.78em;font-weight:400;color:var(--mut)}
.c b{display:block;font-size:1.5em;margin-bottom:.4vmin}
.c.hi{border-color:var(--y);background:#fde04726}
.c.bad{border-color:var(--r);background:#fb718526}
.c.ok{border-color:var(--a);background:#7dd3fc26}
.ar{align-self:center;color:var(--r);font-size:4.6vmin;font-weight:700}
.big{font-size:clamp(24px,5.4vmin,74px);font-weight:600;display:flex;gap:2vmin;align-items:center;justify-content:center}
.big i{font-style:normal;display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--y);border:.4vmin solid var(--a);color:#0a1f5c;font-size:.8em;font-weight:700;flex:none}
.ctr{text-align:center;align-items:center}
.ctr .row{justify-content:center}
.ft{display:flex;justify-content:space-between;align-items:center;padding:1.5vmin 5vw;color:var(--mut);font-size:max(1.5vmin,11px)}
.ft button{background:var(--y);border:.3vmin solid var(--a);color:#0a1f5c;border-radius:1vmin;padding:.8vmin 2vmin;font:inherit;font-weight:700;cursor:pointer}
.ft button:focus-visible{outline:3px solid var(--r)}
.qr{width:min(42vmin,70vw);height:auto;image-rendering:pixelated;background:#fff;padding:2vmin;border:.5vmin solid var(--a);border-radius:2vmin}
:root[data-s="1"]{--bg:#064e3b}:root[data-s="2"]{--bg:#3b1b7a}:root[data-s="3"]{--bg:#5a1236}:root[data-s="4"]{--bg:#0e4a5a}
@media(max-width:700px){.ar{display:none}}
</style></head>
<body><div id="app"><div class="steps" id="st"></div><main class="sl" id="sl"></main>
<div class="ft"><span id="n"></span><span><button id="pv" aria-label="Anterior">←</button> <button id="nx" aria-label="Próximo">→</button></span></div></div>
<script>
const S=["ENTENDER","USAR","PEDIR","CRIAR","ESTUDAR"];
const C=(a,b,k)=>`<div class="c ${k||''}">${a}${b?`<small>${b}</small>`:''}</div>`;
const R=(...x)=>`<div class="row">${x.join('')}</div>`;
const F=x=>`<div class="row">${x.join('<span class="ar">→</span>')}</div>`;
const Q=t=>`<div class="q">${t}</div>`;
const N=a=>a.map((t,i)=>`<div class="big"><i>${i+1}</i>${t}</div>`).join('');
const D=[
[-1,`<h1>INTELIGÊNCIA<br><span class="g">ARTIFICIAL</span><br>NA PRÁTICA</h1><h2>Como usar IA para fazer mais, aprender melhor e criar suas próprias ferramentas</h2><p>Mini-curso prático para estudantes</p>`],
[0,`<h1>O que vamos fazer hoje?</h1>`+F([C('01 Entender','O que é IA?'),C('02 Usar','O que podemos fazer com ela?'),C('03 Pedir','Como conseguir resultados melhores?'),C('04 Criar','Como criar nosso próprio agente?'),C('05 Estudar','Como usar IA para aprender?')])],
[0,`<h1>O que é <span class="g">IA?</span></h1>`+Q('Tecnologias que realizam tarefas que associamos à inteligência humana: reconhecer padrões, compreender linguagem, fazer previsões e tomar decisões.')+R(C('<b>👁️</b>Reconhecer'),C('<b>🗣️</b>Compreender'),C('<b>🧠</b>Analisar'),C('<b>🔎</b>Encontrar padrões'),C('<b>🤖</b>Executar tarefas'))],
[0,`<h1>IA não é uma coisa só</h1>`+R(C('Visão computacional','entende imagens'),C('Reconhecimento de voz','entende fala'),C('Recomendação','sugere vídeos, músicas, produtos'),C('IA generativa','cria novos conteúdos','hi'))+Q('IA é um campo enorme. A IA generativa é apenas uma parte dele.')],
[0,`<h1><span class="g">IA generativa</span></h1>`+Q('Gera novos conteúdos a partir dos padrões que aprendeu.')+R(C('Texto → Texto'),C('Texto → Imagem'),C('Texto → Áudio'),C('Texto → Vídeo'),C('Código → Código'))+R(C('📝 textos'),C('🖼️ imagens'),C('🎵 áudio'),C('🎬 vídeos'),C('💻 código'))],
[0,`<h1>Como ela funciona?</h1>`+F([C('Você dá uma instrução'),C('A IA interpreta o pedido'),C('O modelo gera uma resposta'),C('Você avalia e ajusta')])+Q('“Explique a fotossíntese para um aluno de 15 anos.”')+`<h2 class="g">É uma conversa: você pede, avalia, ajusta e continua.</h2>`],
[0,`<h1>A IA não “pensa” como uma pessoa</h1>`+Q('Ela identifica padrões e gera respostas com base no que aprendeu e no que você informa.')+`<h2 class="g">Uma resposta pode parecer muito convincente e ainda assim estar errada.</h2><p>Primeiro passo do pensamento crítico: confira.</p>`],
[0,`<h1>Então por que ela é tão útil?</h1>`+R(C('📝 Criar'),C('🔎 Pesquisar'),C('📚 Explicar'),C('💡 Ideias'))+R(C('📊 Analisar'),C('🖼️ Gerar imagens'),C('💻 Programar'),C('📄 Documentos'))+Q('A grande mudança é poder interagir com a IA usando linguagem natural.')],
[1,`<h1>Qual IA você usa?</h1><h2>E se a pergunta certa fosse:</h2><h1 class="g">“Qual IA é adequada para o que eu quero fazer?”</h1>`,1],
[1,`<h1>Existem muitas ferramentas</h1>`+R(C('ChatGPT'),C('Gemini'),C('Claude'),C('Perplexity'))+R(C('NotebookLM'),C('Canva'),C('Gamma'))+`<p>Cada uma tem recursos diferentes.</p>`],
[1,`<h1>O que dá para fazer com IA?</h1>`+R(C('📝 Escrever'),C('🔎 Pesquisar'),C('📚 Estudar'),C('🖼️ Criar imagens'))+R(C('🎤 Criar apresentações'),C('💻 Programar'),C('📄 Analisar documentos'),C('💡 Criar ideias'))+`<h2 class="g">Não é “qual IA é melhor?”, e sim “qual ferramenta faz sentido para esta tarefa?”</h2>`],
[1,`<h1>Qual ferramenta usar?</h1>`+Q('“Preciso estudar para uma prova usando um PDF da escola.”')+`<h2>Qual ferramenta você escolheria?</h2>`+R(C('📚 NotebookLM','trabalha a partir dos seus materiais de estudo','hi'))],
[1,`<h1 class="g">VAMOS TESTAR UMA IA</h1>`+Q('“Explique a teoria da relatividade para um aluno de 15 anos usando uma analogia.”')+`<p>Demonstração ao vivo.</p>`],
[2,`<p>Mas existe um problema…</p><h1 class="g">A IA só sabe o que você conta para ela.</h1>`+R(C('Pedido ruim','resultado genérico','bad'),C('Pedido claro','resultado mais próximo do que você quer','ok'))],
[2,`<h1>Prompt ruim × prompt melhor</h1>`+R(C('Prompt 1','“Faça um resumo sobre a Revolução Francesa.”','bad'),C('Prompt 2','“Explique a Revolução Francesa para um estudante do ensino médio, usando linguagem simples. Organize em causas, principais acontecimentos e consequências.”','ok'))],
[2,`<h1>O que torna um prompt melhor?</h1>`+R(C('🎯 Objetivo','O que quero?'),C('👤 Contexto','Para quem?'),C('📋 Instrução','O que deve fazer?'),C('📐 Formato','Como quero receber?'))+`<h2 class="g">Quanto mais claro você for, menos a IA precisa adivinhar.</h2><p>Mas será que precisamos escrever tudo isso toda vez?</p>`],
[3,`<h2>E se pudéssemos criar uma IA especializada em uma tarefa?</h2><h1 class="g">É aí que entram os agentes.</h1>`,1],
[3,`<h1>O que é um agente?</h1>`+Q('Uma IA configurada para cumprir uma função específica, seguindo instruções que nós definimos.')+R(C('IA comum','“Faça um prompt para mim.”'),C('Agente','“Sempre transforme meu pedido em um prompt completo, claro e eficiente.”','hi'))],
[3,`<h1>Nosso <span class="g">agente de prompts</span></h1>`+F([C('Pedido simples'),C('Entender o objetivo'),C('Completar informações'),C('Estruturar'),C('Criar prompt'),C('Pronto para copiar','', 'hi')])],
[3,`<h1 class="g">AGORA É COM VOCÊ</h1>`+N(['Abra o Gemini','Crie seu agente','Cole as instruções fornecidas','Salve'])],

let i=Math.min(Math.max((parseInt(location.hash.slice(1))||1)-1,0),D.length-1);
function go(k){i=Math.min(Math.max(k,0),D.length-1);const[s,h,c]=D[i];document.documentElement.dataset.s=s;
document.getElementById('st').innerHTML=S.map((t,j)=>`<div class="st ${j==s?'on':j<s?'done':''}">${String(j+1).padStart(2,'0')} ${t}</div>`).join('');
const m=document.getElementById('sl');m.className='sl'+(i==0||c?' ctr':'');m.innerHTML=h;
document.getElementById('n').textContent=(i+1)+' / '+D.length;try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
document.getElementById('nx').onclick=()=>go(i+1);document.getElementById('pv').onclick=()=>go(i-1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','PageUp'].includes(e.key))go(i-1)});
go(i);
